<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Novo Aviator 2026
    </title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #2b0a14, #0b0205);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 20px 16px 28px;
    }

    .title {
      text-align: center;
      font-weight: 700;
      margin-bottom: 14px;
      color: #ff6a00;
      letter-spacing: 0.5px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: block;
      text-align: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .btn-primary {
      background: linear-gradient(90deg, #ff6a00, #ff005d);
      color: #fff;
      box-shadow: 0 0 18px rgba(255, 80, 0, 0.55);
    }

    .btn-secondary {
      background: linear-gradient(90deg, #ff9a00, #ffb300);
      color: #1a0c00;
      box-shadow: 0 0 18px rgba(255, 170, 0, 0.55);
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.01);
      filter: brightness(1.05);
      box-shadow: 0 0 24px rgba(255, 120, 0, 0.75);
    }

    .video-card {
      margin: 14px 0 18px;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 0 28px rgba(0, 0, 0, 0.6);
      background: #000;
    }

    video {
      width: 100%;
      display: block;
    }

    .note {
      text-align: center;
      font-size: 12px;
      margin-top: 10px;
      opacity: 0.85;
    }

    @media (max-width: 360px) {
      .btn { font-size: 14px; padding: 13px; }
      .title { font-size: 15px; }
    }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="title">
        Novo Aviator 2026
      </h2>
      <a href="https://www.megagamelive.com/affiliates/?btag=2192686" target="_blank" class="btn btn-primary">      Criar conta agora
</a>
      <div class="video-card">
        <video autoplay="" muted="" loop="" playsinline="">
          <source src="https://novoaviator2026.vercel.app/assets/aviator-video-Kx-qAN4P.mp4" type="video/mp4" />
          Seu navegador não suporta vídeo.
        </video>
      </div>
      <a href="https://www.megagamelive.com/affiliates/?btag=2192686" target="_blank" class="btn btn-secondary">      Criar conta agora
</a>
      <p class="note">
        Após criar a conta, volte para acessar a área completa.
      </p>
    </div>
  </body>
</html>
